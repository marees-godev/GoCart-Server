syntax = "proto3";

package gocart.order.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/order;order";

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrderStatus (UpdateOrderStatusRequest) returns (UpdateOrderStatusResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}

message OrderItem {
  string id = 1;
  string product_id = 2;
  int32 quantity = 3;
  double unit_price = 4;
  string store_id = 5;
  string sku = 6;
  string product_name = 7;
  double tax = 8;
  double discount = 9;
  double total_price = 10;
}

message Order {
  string id = 1;
  string user_id = 2;
  string status = 3;
  repeated OrderItem items = 4;
  double total_amount = 5;
  string shipping_address = 6;
  string created_at = 7;
  string parent_order_id = 8;
  string store_id = 9;
  double subtotal = 10;
  double tax_amount = 11;
  double shipping_fee = 12;
  double discount_amount = 13;
  string currency = 14;
  string payment_status = 15;
  string order_status = 16;
  string shipping_address_id = 17;
  string billing_address_id = 18;
  string updated_at = 19;
  string order_number = 20;
}

message CreateOrderRequest {
  string user_id = 1;
  string cart_id = 2;
  string shipping_address = 3;
  string shipping_address_id = 4;
  string billing_address_id = 5;
  string currency = 6;
  string idempotency_key = 7;
  double shipping_fee = 8;
  double discount_amount = 9;
}

message CreateOrderResponse {
  Order order = 1;
  repeated Order orders = 2;
  string parent_order_id = 3;
}

message GetOrderRequest {
  string id = 1;
  string user_id = 2;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message UpdateOrderStatusRequest {
  string id = 1;
  string status = 2;
}

message UpdateOrderStatusResponse {
  Order order = 1;
}

message CancelOrderRequest {
  string id = 1;
  string user_id = 2;
  string reason = 3;
}

message CancelOrderResponse {
  Order order = 1;
}

