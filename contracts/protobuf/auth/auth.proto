syntax = "proto3";

package gocart.auth.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/auth;auth";

service AuthService {
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (AuthResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc ResendVerificationEmail (ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPasswordWithOtp (ResetPasswordWithOtpRequest) returns (ResetPasswordResponse);
  rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  USER = 1;
  MERCHANT = 2;
  DELIVERY_PARTNER = 3;
  ADMIN = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2; 
  reserved 3;
  reserved "is_merchant";
  Role role = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string first_name = 3;
  string last_name = 4;
  reserved 5;
  reserved "is_merchant";
  Role role = 6;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  reserved 4;
  reserved "is_merchant";
  Role role = 5;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string access_token = 2;
}

message LogoutRequest {
  string access_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  string token_type = 3;
  int64 expires_in = 4;
  string user_id = 5;
  string merchant_id = 7;
  string business_email = 8;
  string first_name = 9;
  string last_name = 10;
  string partner_id = 11;
  string customer_id = 12;
  reserved 6;
  reserved "is_merchant";
  Role role = 13;
}

message VerifyEmailRequest {
  string email = 1;
  string otp = 2;
  string token = 3;
  Role role = 4;
}

message VerifyEmailResponse {
  bool success = 1;
  string message = 2;
}

message ResendVerificationEmailRequest {
  string email = 1;
  Role role = 2;
}

message ResendVerificationEmailResponse {
  bool success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
  string client_ip = 2;
  reserved 3;
  reserved "is_merchant";
  Role role = 4;
}

message ForgotPasswordResponse {
  bool success = 1;
  string message = 2;
}

message ResetPasswordWithOtpRequest {
  string email = 1;
  string otp = 2;
  string new_password = 3;
  reserved 4;
  reserved "is_merchant";
  Role role = 5;
}

message ResetPasswordResponse {
  bool success = 1;
  string message = 2;
}

message ChangePasswordRequest {
  string user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

