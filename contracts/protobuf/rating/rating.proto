syntax = "proto3";

package gocart.rating.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/rating;rating";

enum FlagCategory {
  UNSPECIFIED = 0;
  SPAM = 1;
  INAPPROPRIATE_CONTENT = 2;
  FAKE_REVIEW = 3;
  IRRELEVANT = 4;
  OTHER = 5;
}

service RatingService {
  rpc CreateRating (CreateRatingRequest) returns (CreateRatingResponse);
  rpc GetRating (GetRatingRequest) returns (GetRatingResponse);
  rpc GetProductRatings (GetProductRatingsRequest) returns (GetProductRatingsResponse);
  rpc UpdateRating (UpdateRatingRequest) returns (UpdateRatingResponse);
  rpc DeleteRating (DeleteRatingRequest) returns (DeleteRatingResponse);
  rpc FlagRating (FlagRatingRequest) returns (FlagRatingResponse);
  rpc GetFlaggedRatings (GetFlaggedRatingsRequest) returns (GetFlaggedRatingsResponse);
  rpc ModerateRatings (ModerateRatingRequest) returns (ModerateRatingResponse);
  rpc UploadRatingImages (UploadRatingImagesRequest) returns (UploadRatingImagesResponse);
  rpc DeleteRatingImage (DeleteRatingImageRequest) returns (DeleteRatingImageResponse);
}

message Rating {
  string id = 1;
  string user_id = 2;
  string product_id = 3;
  string order_id = 4;
  string order_item_id = 5;
  int32 rating = 6;
  string review = 7;
  bool is_flagged = 8;
  bool is_hidden = 9;
  string created_at = 10;
  string updated_at = 11;
  repeated RatingImage images = 12;
}

message CreateRatingRequest {
  string product_id = 1;
  string order_id = 2;
  string order_item_id = 3;
  string user_id = 4;
  int32 rating = 5;
  string review = 6;
  repeated string images = 7;
}

message CreateRatingResponse {
  Rating rating = 1;
}

message GetRatingRequest {
  string id = 1;
}

message GetRatingResponse {
  Rating rating = 1;
}

message StarRating  {
  int32 five_star = 1;
  int32 four_star = 2;
  int32 three_star = 3;
  int32 two_star = 4;
  int32 one_star = 5;
}

message GetProductRatingsRequest {
  string product_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message GetProductRatingsResponse {
  repeated Rating ratings = 1;
  double average_rating = 2;
  int32 total = 3;
  StarRating stars = 4;
}

message UpdateRatingRequest {
  string id = 1;
  string user_id = 2;
  int32 rating = 3;
  string review = 4;
}

message UpdateRatingResponse {
  Rating rating = 1;
}

message DeleteRatingRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteRatingResponse {
  bool success = 1;
  string message = 2;
}

message FlagRatingRequest {
  string rating_id = 1;
  string user_id = 2;
  FlagCategory category = 3;
  string reason = 4;
}

message FlagRatingResponse {
  bool success = 1;
  string message = 2;
}

message RatingFlag {
  string id = 1;
  string user_id = 2;
  FlagCategory category = 3;
  string reason = 4;
  string created_at = 5;
}

message FlaggedRatingItem {
  Rating rating = 1;
  int32 flag_count = 2;
  repeated RatingFlag flags = 3;
}

message GetFlaggedRatingsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string admin_id = 3;
}

message GetFlaggedRatingsResponse {
  repeated FlaggedRatingItem items = 1;
  int32 total = 2;
}

message ModerateRatingRequest {
  string rating_id = 1;
  string admin_id = 2;
  bool is_hidden = 3;
}

message ModerateRatingResponse {
  bool success = 1;
  string message = 2;
}

message RatingImage {
  string id = 1;
  string rating_id = 2;
  string url = 3;
  string created_at = 4;
}

message UploadRatingImagesRequest {
  string rating_id = 1;
  string user_id = 2;
  repeated string images = 3;
}

message UploadRatingImagesResponse {
  repeated RatingImage images = 1;
}

message DeleteRatingImageRequest {
  string image_id = 1;
  string user_id = 2;
}

message DeleteRatingImageResponse {
  bool success = 1;
  string message = 2;
}