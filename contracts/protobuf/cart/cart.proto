syntax = "proto3";

package gocart.cart.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/cart;cart";

service CartService {
  rpc GetCart (GetCartRequest) returns (GetCartResponse);
  rpc AddCartItem (AddCartItemRequest) returns (AddCartItemResponse);
  rpc AddToCart (AddToCartRequest) returns (AddToCartResponse);
  rpc UpdateCartItem (UpdateCartItemRequest) returns (UpdateCartItemResponse);
  rpc RemoveCartItem (RemoveCartItemRequest) returns (RemoveCartItemResponse);
  rpc RemoveFromCart (RemoveFromCartRequest) returns (RemoveFromCartResponse);
  rpc ClearCart (ClearCartRequest) returns (ClearCartResponse);
}

message CartItem {
  string id = 1;
  string product_id = 2;
  string variant_id = 3;
  string store_id = 4;
  double unit_price = 5;
  int32 quantity = 6;
}

message Cart {
  string id = 1;
  string user_id = 2;
  repeated CartItem items = 3;
  double total_amount = 4;
  string updated_at = 5;
}

message GetCartRequest {
  string user_id = 1;
}

message GetCartResponse {
  Cart cart = 1;
}

message AddCartItemRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
  string store_id = 4;
  double unit_price = 5;
  int32 quantity = 6;
}

message AddCartItemResponse {
  Cart cart = 1;
}

message AddToCartRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
  string store_id = 4;
  double unit_price = 5;
  int32 quantity = 6;
}

message AddToCartResponse {
  Cart cart = 1;
}

message UpdateCartItemRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
  int32 quantity = 4;
}

message UpdateCartItemResponse {
  Cart cart = 1;
}

message RemoveCartItemRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
}

message RemoveCartItemResponse {
  Cart cart = 1;
}

message RemoveFromCartRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
}

message RemoveFromCartResponse {
  Cart cart = 1;
}

message ClearCartRequest {
  string user_id = 1;
}

message ClearCartResponse {
  bool success = 1;
  Cart cart = 2;
}

