syntax = "proto3";

package gocart.cart.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/cart;cart";

service CartService {
  rpc GetCart (GetCartRequest) returns (GetCartResponse);
  rpc AddCartItem (AddCartItemRequest) returns (AddCartItemResponse);
  rpc UpdateCartItem (UpdateCartItemRequest) returns (UpdateCartItemResponse);
  rpc RemoveCartItem (RemoveCartItemRequest) returns (RemoveCartItemResponse);
  rpc ClearCart (ClearCartRequest) returns (ClearCartResponse);
  rpc ValidateCart (ValidateCartRequest) returns (ValidateCartResponse);
  rpc PrepareCheckout (PrepareCheckoutRequest) returns (PrepareCheckoutResponse);
}

message CartItem {
  string id = 1;
  string product_id = 2;
  string variant_id = 3;
  string store_id = 4;
  double unit_price = 5;
  int32 quantity = 6;
}

message Cart {
  string id = 1;
  string user_id = 2;
  repeated CartItem items = 3;
  double total_amount = 4;
  string updated_at = 5;
}

message GetCartRequest {
  string user_id = 1;
}

message GetCartResponse {
  Cart cart = 1;
}

message AddCartItemRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
  string store_id = 4;
  double unit_price = 5;
  int32 quantity = 6;
}

message AddCartItemResponse {
  Cart cart = 1;
}

message UpdateCartItemRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
  int32 quantity = 4;
}

message UpdateCartItemResponse {
  Cart cart = 1;
}

message RemoveCartItemRequest {
  string user_id = 1;
  string product_id = 2;
  string variant_id = 3;
}

message RemoveCartItemResponse {
  Cart cart = 1;
}

message ClearCartRequest {
  string user_id = 1;
}

message ClearCartResponse {
  bool success = 1;
  Cart cart = 2;
}

message ValidateCartRequest {
  string user_id = 1;
}

message ValidationError {
  string product_id = 1;
  string message = 2;
  int32 code = 3;
}

message StoreOrderGroup {
  string store_id = 1;
  repeated CartItem items = 2;
  double subtotal = 3;
}

message ValidateCartResponse {
  bool is_valid = 1;
  Cart cart = 2;
  repeated ValidationError errors = 3;
  repeated StoreOrderGroup store_groups = 4;
}

message PrepareCheckoutRequest {
  string user_id = 1;
  string shipping_address = 2;
}

message StoreOrderPayload {
  string parent_order_id = 1;
  string store_id = 2;
  string user_id = 3;
  repeated CartItem items = 4;
  double subtotal = 5;
  double total_amount = 6;
  string shipping_address = 7;
}

message PrepareCheckoutResponse {
  bool is_valid = 1;
  string parent_order_id = 2;
  repeated StoreOrderPayload orders = 3;
  repeated ValidationError errors = 4;
}

