syntax = "proto3";

package gocart.payment.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/payment;payment";

service PaymentService {
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc GetPaymentByOrderID(GetPaymentByOrderIDRequest) returns (GetPaymentResponse);
  rpc CreateRefund(CreateRefundRequest) returns (CreateRefundResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
  rpc GetRefundsByPaymentID(GetRefundsByPaymentIDRequest) returns (GetRefundsByPaymentIDResponse);
}

message Payment {
  string id = 1;
  string order_id = 2;
  double amount = 3;
  string currency = 4;
  string payment_method = 5;
  string status = 6;
  string transaction_reference = 7;
  string gateway_transaction_id = 8;
  string created_at = 9;
  string user_id = 10;
  string idempotency_key = 11;
  string failure_reason = 12;
  string updated_at = 13;
}

message ProcessPaymentRequest {
  string order_id = 1;
  double amount = 2;
  string currency = 3;
  string payment_method = 4;
  string idempotency_key = 5;
  string user_id = 6;
}

message ProcessPaymentResponse {
  Payment payment = 1;
}

message GetPaymentRequest {
  string id = 1;
}

message GetPaymentByOrderIDRequest {
  string order_id = 1;
}

message GetPaymentResponse {
  Payment payment = 1;
}

message CreateRefundRequest {
  string payment_id = 1;
  double amount = 2;
  string reason = 3;
  string idempotency_key = 4;
}

message CreateRefundResponse {
  string refund_id = 1;
  string status = 2;
  double amount = 3;
  string gateway_refund_id = 4;
  string created_at = 5;
  string payment_id = 6;
  string order_id = 7;
}

message CancelPaymentRequest {
  string payment_id = 1;
  string reason = 2;
  string order_id = 3;
}

message CancelPaymentResponse {
  Payment payment = 1;
}

message Refund {
  string id = 1;
  string payment_id = 2;
  string order_id = 3;
  double amount = 4;
  string reason = 5;
  string status = 6;
  string gateway_refund_id = 7;
  string idempotency_key = 8;
  string created_at = 9;
  string updated_at = 10;
}

message GetRefundsByPaymentIDRequest {
  string payment_id = 1;
}

message GetRefundsByPaymentIDResponse {
  repeated Refund refunds = 1;
}

