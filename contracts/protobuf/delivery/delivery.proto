syntax = "proto3";

package gocart.delivery.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/delivery;delivery";

service DeliveryService {
  rpc CreateDelivery (CreateDeliveryRequest) returns (CreateDeliveryResponse);
  rpc GetDelivery (GetDeliveryRequest) returns (GetDeliveryResponse);
  rpc GetDeliveryByTracking (GetDeliveryByTrackingRequest) returns (GetDeliveryResponse);
  rpc GetDeliveryByOrder (GetDeliveryByOrderRequest) returns (GetDeliveryResponse);
  rpc UpdateDeliveryStatus (UpdateDeliveryStatusRequest) returns (UpdateDeliveryStatusResponse);
  rpc CancelDelivery (CancelDeliveryRequest) returns (CancelDeliveryResponse);
  rpc CalculateShippingFee (CalculateShippingFeeRequest) returns (CalculateShippingFeeResponse);

  rpc CreatePartnerProfile (CreatePartnerProfileRequest) returns (PartnerProfileResponse);
  rpc GetPartnerProfile (GetPartnerProfileRequest) returns (PartnerProfileResponse);
  rpc UpdatePartnerProfile (UpdatePartnerProfileRequest) returns (PartnerProfileResponse);
  rpc VerifyGSTIN (VerifyPartnerGSTINRequest) returns (PartnerProfileResponse);

  rpc ActivatePartner (ActivatePartnerRequest) returns (PartnerProfileResponse);
  rpc DeactivatePartner (DeactivatePartnerRequest) returns (PartnerProfileResponse);
  rpc DeletePartnerProfile (DeletePartnerProfileRequest) returns (DeletePartnerProfileResponse);
  rpc ApprovePartner (ApprovePartnerRequest) returns (PartnerProfileResponse);
  rpc RejectPartner (RejectPartnerRequest) returns (PartnerProfileResponse);
  rpc AppealRejection (AppealRejectionRequest) returns (PartnerProfileResponse);
  rpc ListAppealedPartners (ListAppealedPartnersRequest) returns (ListAppealedPartnersResponse);
  rpc ListApprovedPartners (ListApprovedPartnersRequest) returns (ListApprovedPartnersResponse);
  rpc ProcessExpiredDeactivations (ProcessExpiredDeactivationsRequest) returns (ProcessExpiredDeactivationsResponse);
}

message DeliveryTrackingUpdate {
  string id = 1;
  string status = 2;
  string location = 3;
  string notes = 4;
  string created_at = 5;
}

message Delivery {
  string id = 1;
  string order_id = 2;
  string tracking_number = 3;
  string status = 4;
  string estimated_delivery_at = 5;
  string delivered_at = 6;
  string delivery_partner = 7;
  string shipping_address = 8;
  string updated_at = 9;
  string created_at = 10;
  string contact_number = 11;
  string shipping_address_id = 12;
  repeated DeliveryTrackingUpdate tracking_updates = 13;
}

message CreateDeliveryRequest {
  string order_id = 1;
  string delivery_partner = 2;
  string shipping_address = 3;
  string contact_number = 4;
  string shipping_address_id = 5;
}

message CreateDeliveryResponse {
  Delivery delivery = 1;
}

message GetDeliveryRequest {
  string id = 1;
}

message GetDeliveryByTrackingRequest {
  string tracking_number = 1;
}

message GetDeliveryByOrderRequest {
  string order_id = 1;
}

message GetDeliveryResponse {
  Delivery delivery = 1;
}

message UpdateDeliveryStatusRequest {
  string id = 1;
  string status = 2;
  string location = 3;
}

message UpdateDeliveryStatusResponse {
  Delivery delivery = 1;
}

message CancelDeliveryRequest {
  string delivery_id = 1;
  string order_id = 2;
  string reason = 3;
}

message CancelDeliveryResponse {
  Delivery delivery = 1;
  bool success = 2;
  string message = 3;
}

message ShippingItem {
  string product_id = 1;
  int32 quantity = 2;
  double weight_grams = 3;
}

message CalculateShippingFeeRequest {
  double weight_grams = 1;
  string zone = 2;
  string origin_city = 3;
  string origin_state = 4;
  string destination_city = 5;
  string destination_state = 6;
  string destination_postal_code = 7;
  string shipping_address = 8;
  repeated ShippingItem items = 9;
  string model = 10;
  string partner_id = 11;
}

message CalculateShippingFeeResponse {
  double shipping_fee = 1;
  string currency = 2;
  string zone = 3;
  double total_weight_grams = 4;
  string calculation_model = 5;
  string breakdown_details = 6;
}

message DeliveryPartnerProfile {
  string id = 1;
  string partner_id = 2;
  string company_name = 3;
  string email = 4;
  string contact_number = 5;
  bool is_active = 6;
  string created_at = 7;
  string updated_at = 8;
  string approval_status = 9;
  string rejection_reason = 10;
  string appeal_reason = 11;
  string appealed_at = 12;
  string deactivated_at = 13;
  string deleted_at = 14;
  string gstin = 15;
  bool is_gstin_verified = 16;
  string deactivation_reason = 17;
  optional string deletion_reason = 18;
}

message CreatePartnerProfileRequest {
  string partner_id = 1;
  string company_name = 2;
  string email = 3;
  string contact_number = 4;
  optional string gstin = 5;
}

message GetPartnerProfileRequest {
  string partner_id = 1;
}

message UpdatePartnerProfileRequest {
  string partner_id = 1;
  optional string company_name = 2;
  optional string email = 3;
  optional string contact_number = 4;
  optional string gstin = 5;
  string caller_id = 6;
}

message VerifyPartnerGSTINRequest {
  string partner_id = 1;
  string gstin = 2;
  string caller_id = 3;
}

message PartnerProfileResponse {
  DeliveryPartnerProfile profile = 1;
}

message ActivatePartnerRequest {
  string partner_id = 1;
  string caller_id = 2;
}

message DeactivatePartnerRequest {
  string partner_id = 1;
  string reason = 2;
  string caller_id = 3;
}

message DeletePartnerProfileRequest {
  string partner_id = 1;
  string caller_id = 2;
  optional string reason = 3;
}

message DeletePartnerProfileResponse {
  bool success = 1;
  string message = 2;
  string status = 3;
}

message ApprovePartnerRequest {
  string partner_id = 1;
}

message RejectPartnerRequest {
  string partner_id = 1;
  string reason = 2;
}

message AppealRejectionRequest {
  string partner_id = 1;
  string reason = 2;
  string caller_id = 3;
}

message ListAppealedPartnersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListAppealedPartnersResponse {
  repeated DeliveryPartnerProfile profiles = 1;
  int32 total = 2;
}

message ListApprovedPartnersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListApprovedPartnersResponse {
  repeated DeliveryPartnerProfile profiles = 1;
  int32 total = 2;
}

message ProcessExpiredDeactivationsRequest {
  int32 retention_minutes = 1;
}

message ProcessExpiredDeactivationsResponse {
  int32 processed_count = 1;
  string message = 2;
}
