syntax = "proto3";

package gocart.delivery.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/delivery;delivery";

service DeliveryService {
  rpc CreateDelivery (CreateDeliveryRequest) returns (CreateDeliveryResponse);
  rpc GetDelivery (GetDeliveryRequest) returns (GetDeliveryResponse);
  rpc GetDeliveryByTracking (GetDeliveryByTrackingRequest) returns (GetDeliveryResponse);
  rpc GetDeliveryByOrder (GetDeliveryByOrderRequest) returns (GetDeliveryResponse);
  rpc UpdateDeliveryStatus (UpdateDeliveryStatusRequest) returns (UpdateDeliveryStatusResponse);

  rpc CreatePartnerProfile (CreatePartnerProfileRequest) returns (PartnerProfileResponse);
  rpc GetPartnerProfile (GetPartnerProfileRequest) returns (PartnerProfileResponse);
  rpc UpdatePartnerProfile (UpdatePartnerProfileRequest) returns (PartnerProfileResponse);
}

message Delivery {
  string id = 1;
  string order_id = 2;
  string tracking_number = 3;
  string status = 4;
  string estimated_delivery_at = 5;
  string delivered_at = 6;
  string delivery_partner = 7;
  string shipping_address = 8;
  string updated_at = 9;
  string created_at = 10;
  string contact_number = 11;
}

message CreateDeliveryRequest {
  string order_id = 1;
  string delivery_partner = 2;
  string shipping_address = 3;
  string contact_number = 4;
}

message CreateDeliveryResponse {
  Delivery delivery = 1;
}

message GetDeliveryRequest {
  string id = 1;
}

message GetDeliveryByTrackingRequest {
  string tracking_number = 1;
}

message GetDeliveryByOrderRequest {
  string order_id = 1;
}

message GetDeliveryResponse {
  Delivery delivery = 1;
}

message UpdateDeliveryStatusRequest {
  string id = 1;
  string status = 2;
  string location = 3;
}

message UpdateDeliveryStatusResponse {
  Delivery delivery = 1;
}

message DeliveryPartnerProfile {
  string id = 1;
  string partner_id = 2;
  string company_name = 3;
  string email = 4;
  string contact_number = 5;
  bool is_active = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreatePartnerProfileRequest {
  string partner_id = 1;
  string company_name = 2;
  string email = 3;
  string contact_number = 4;
}

message GetPartnerProfileRequest {
  string partner_id = 1;
}

message UpdatePartnerProfileRequest {
  string partner_id = 1;
  optional string company_name = 2;
  optional string email = 3;
  optional string contact_number = 4;
}

message PartnerProfileResponse {
  DeliveryPartnerProfile profile = 1;
}
