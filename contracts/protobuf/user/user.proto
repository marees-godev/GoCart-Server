syntax = "proto3";

package gocart.user.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/user;user";

service UserService {
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser (GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc CreateUserAddress (CreateUserAddressRequest) returns (CreateUserAddressResponse);
  rpc ListUserAddresses (ListUserAddressesRequest) returns (ListUserAddressesResponse);
  rpc GetUserAddress (GetUserAddressRequest) returns (GetUserAddressResponse);
  rpc UpdateUserAddress (UpdateUserAddressRequest) returns (UpdateUserAddressResponse);
  rpc DeleteUserAddress (DeleteUserAddressRequest) returns (DeleteUserAddressResponse);
  rpc SetDefaultUserAddress (SetDefaultUserAddressRequest) returns (SetDefaultUserAddressResponse);
}

message User {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string phone = 5;
  string created_at = 6;
}

message Address {
  string id = 1;
  string user_id = 2;
  string label = 3;
  string full_name = 4;
  string phone_number = 5;
  string email_address = 6;
  string address_line = 7;
  string city = 8;
  string state = 9;
  string postal_code = 10;
  string country = 11;
  bool is_default = 12;
  string created_at = 13;
  string updated_at = 14;
}

message CreateUserRequest {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string phone = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message CreateUserAddressRequest {
  string user_id = 1;
  string label = 2;
  string full_name = 3;
  string phone_number = 4;
  string email_address = 5;
  string address_line = 6;
  string city = 7;
  string state = 8;
  string postal_code = 9;
  string country = 10;
  bool is_default = 11;
}

message CreateUserAddressResponse {
  Address address = 1;
}

message ListUserAddressesRequest {
  string user_id = 1;
}

message ListUserAddressesResponse {
  repeated Address addresses = 1;
}

message GetUserAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message GetUserAddressResponse {
  Address address = 1;
}

message UpdateUserAddressRequest {
  string user_id = 1;
  string address_id = 2;
  optional string label = 3;
  optional string full_name = 4;
  optional string phone_number = 5;
  optional string email_address = 6;
  optional string address_line = 7;
  optional string city = 8;
  optional string state = 9;
  optional string postal_code = 10;
  optional string country = 11;
  optional bool is_default = 12;
}

message UpdateUserAddressResponse {
  Address address = 1;
}

message DeleteUserAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message DeleteUserAddressResponse {
  bool success = 1;
}

message SetDefaultUserAddressRequest {
  string user_id = 1;
  string address_id = 2;
}

message SetDefaultUserAddressResponse {
  Address address = 1;
}
