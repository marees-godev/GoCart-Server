syntax = "proto3";

package merchant.v1;

option go_package = "github.com/marees-godev/GoCart-Server/contracts/protobuf/merchant;merchant";

import "google/protobuf/timestamp.proto";

enum MerchantStatus {
  PENDING = 0;
  APPROVED = 1;
  REJECTED = 2;
  SUSPENDED = 3;
}
enum MerchantLifecycleStatus {
  MERCHANT_LIFECYCLE_UNSPECIFIED = 0;
  MERCHANT_LIFECYCLE_ACTIVE = 1;
  MERCHANT_LIFECYCLE_INACTIVE = 2;
  MERCHANT_LIFECYCLE_PENDING_REVIEW = 3;
  MERCHANT_LIFECYCLE_SUSPENDED = 4;
  MERCHANT_LIFECYCLE_TERMINATED = 5;
}

service MerchantService {
  rpc GetMerchant (GetMerchantRequest) returns (GetMerchantResponse);
  rpc UpdateMerchant (UpdateMerchantRequest) returns (UpdateMerchantResponse);
  rpc CreateMerchant (CreateMerchantRequest) returns (CreateMerchantResponse);
  rpc ListMerchants (ListMerchantsRequest) returns (ListMerchantsResponse);
  rpc UpdateMerchantStatus (UpdateMerchantStatusRequest) returns (UpdateMerchantStatusResponse);
  rpc DeleteMerchant (DeleteMerchantRequest) returns (DeleteMerchantResponse);
  rpc ActivateMerchant (LifecycleMerchantRequest) returns (LifecycleMerchantResponse);
  rpc SuspendMerchant (LifecycleMerchantRequest) returns (LifecycleMerchantResponse);
  rpc ReactivateMerchant (LifecycleMerchantRequest) returns (LifecycleMerchantResponse);
  rpc CreateMerchantAppeal (CreateMerchantAppealRequest) returns (CreateMerchantAppealResponse);
  rpc GetMerchantAppeals (GetMerchantAppealsRequest) returns (GetMerchantAppealsResponse);
}

message MerchantResponseData {
  string id = 1;
  string business_name = 2;
  string first_name = 3;
  string last_name = 4;
  string business_email = 5;
  string business_phone = 6;
  string pan_card_number = 7;
  MerchantStatus status = 8;
  string rejection_reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp deleted_at = 12;
}

message GetMerchantRequest {
  string id = 1;
}

message GetMerchantResponse {
  MerchantResponseData merchant = 1;
}

message UpdateMerchantRequest {
  string id = 1;
  string business_name = 2;
  string business_phone = 3;
  string pan_card_number = 4;
  string first_name = 5;
  string last_name = 6;
}

message UpdateMerchantResponse {
  MerchantResponseData merchant = 1;
}

message CreateMerchantRequest {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string business_email = 4;
}

message CreateMerchantResponse {
  MerchantResponseData merchant = 1;
}

message ListMerchantsRequest {
  int32 limit = 1;
  int32 offset = 2;
  optional MerchantStatus status = 3;
  optional MerchantLifecycleStatus lifecycle_status = 4;
  optional bool reactivated_only = 5;
}

message ListMerchantsResponse {
  repeated MerchantResponseData merchants = 1;
  int32 total = 2;
}

message UpdateMerchantStatusRequest {
  string id = 1;
  MerchantStatus status = 2;
  string rejection_reason = 3;
}

message UpdateMerchantStatusResponse {
  MerchantResponseData merchant = 1;
  MerchantStatus previous_status = 2;
}

message DeleteMerchantRequest {
  string id = 1;
}

message DeleteMerchantResponse {
  bool success = 1;
}

message LifecycleMerchantRequest {
  string id = 1;
  string reason = 2;
}

message LifecycleMerchantResponse {
  MerchantResponseData merchant = 1;
  MerchantLifecycleStatus previous_status = 2;
  string message = 3;
}


message MerchantAppealData {
  string id = 1;
  string merchant_id = 2;
  string reason = 3;
  string status = 4;
  string admin_comment = 5;
  google.protobuf.Timestamp reviewed_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateMerchantAppealRequest {
  string merchant_id = 1;
  string reason = 2;
}

message CreateMerchantAppealResponse {
  MerchantAppealData appeal = 1;
}

message GetMerchantAppealsRequest {
  string merchant_id = 1;
}

message GetMerchantAppealsResponse {
  repeated MerchantAppealData appeals = 1;
}
