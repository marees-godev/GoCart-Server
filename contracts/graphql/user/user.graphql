type User {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  phone: String
  role: String
  createdAt: String
}

type Address {
  id: ID!
  userId: String!
  label: String
  fullName: String
  phoneNumber: String
  emailAddress: String
  addressLine: String!
  city: String!
  state: String!
  postalCode: String!
  country: String!
  isDefault: Boolean!
  createdAt: String
  updatedAt: String
}

input UpdateUserInput {
  firstName: String
  lastName: String
  phone: String
}

input CreateAddressInput {
  label: String
  fullName: String!
  phoneNumber: String!
  emailAddress: String
  addressLine: String!
  city: String!
  state: String!
  postalCode: String!
  country: String!
  isDefault: Boolean
}

input UpdateAddressInput {
  label: String
  fullName: String
  phoneNumber: String
  emailAddress: String
  addressLine: String
  city: String
  state: String
  postalCode: String
  country: String
  isDefault: Boolean
}

extend type Query {
  me: User @auth
  user(id: ID!): User @auth(requires: [ADMIN])
  userAddresses(userId: ID!): [Address!]! @auth
  userAddress(id: ID!): Address @auth
}

extend type Mutation {
  updateUser(id: ID!, input: UpdateUserInput!): User @auth
  createUserAddress(userId: ID!, input: CreateAddressInput!): Address @auth
  updateUserAddress(id: ID!, input: UpdateAddressInput!): Address @auth
  deleteUserAddress(id: ID!): Boolean! @auth
  setDefaultUserAddress(id: ID!): Address @auth
}

