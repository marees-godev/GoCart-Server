enum Role {
  ADMIN
  MERCHANT
  CUSTOMER
}

directive @auth(requires: [Role!]) on FIELD_DEFINITION | OBJECT

type User {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  role: String
  createdAt: String
}

type AuthPayload {
  token: String!
  user: User!
}

input LoginInput {
  email: String!
  password: String!
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String
  lastName: String
}

type Query {
  health: String!
  version: String!
  me: User @auth
  user(id: ID!): User @auth(requires: [ADMIN])
}

type Mutation {
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
}
