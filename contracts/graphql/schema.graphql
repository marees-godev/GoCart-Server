type User {
  id: ID!
  email: String!
  firstName: String
  lastName: String
  role: String
  createdAt: String
}

type AuthPayload {
  token: String!
  user: User!
}

input LoginInput {
  email: String!
  password: String!
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String
  lastName: String
}

type Query {
  health: String!
  version: String!
  me: User
  user(id: ID!): User
}

type Mutation {
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
}
