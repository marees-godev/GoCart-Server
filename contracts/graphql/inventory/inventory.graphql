type StockItem {
  productId: ID!
  availableQuantity: Int!
  reservedQuantity: Int!
}

type InventoryItem {
  inventoryId: ID!
  warehouseId: ID
  productId: ID!
  variantId: String
  sku: String!
  availableQuantity: Int!
  reservedQuantity: Int!
  lowStockThreshold: Int!
  updatedAt: String!
  createdAt: String
}

type ReserveStockPayload {
  reservationId: String!
  expiresAt: String
  success: Boolean!
}

type RestockInventoryPayload {
  inventory: InventoryItem!
  success: Boolean!
}

input ReservationItemInput {
  productId: ID!
  variantId: String
  quantity: Int!
}

input CreateInventoryInput {
  warehouseId: ID
  productId: ID!
  variantId: String
  sku: String
  initialQuantity: Int!
  lowStockThreshold: Int
}

input RestockInventoryInput {
  inventoryId: ID
  productId: ID
  variantId: String
  quantity: Int!
  notes: String
  referenceId: String
}

type Warehouse {
  id: ID!
  deliveryPartnerId: ID!
  name: String!
  code: String!
  street: String!
  city: String!
  state: String!
  postalCode: String!
  isActive: Boolean!
  createdAt: String
  updatedAt: String
}

input CreateWarehouseInput {
  deliveryPartnerId: ID!
  name: String!
  code: String!
  street: String!
  city: String!
  state: String!
  postalCode: String!
  isActive: Boolean
}

input UpdateWarehouseInput {
  id: ID!
  deliveryPartnerId: ID!
  name: String
  code: String
  street: String
  city: String
  state: String
  postalCode: String
  isActive: Boolean
}

type DeleteWarehouseResponse {
  success: Boolean!
  message: String!
}

extend type Query {
  stock(productId: ID!): StockItem
  inventory(productId: ID, variantId: String, inventoryId: ID, warehouseId: ID): InventoryItem @auth(requires: [ADMIN, MERCHANT])
  warehouse(id: ID!, deliveryPartnerId: ID): Warehouse @auth(requires: [DELIVERY_PARTNER, ADMIN])
  myWarehouses(deliveryPartnerId: ID): [Warehouse!]! @auth(requires: [DELIVERY_PARTNER, ADMIN])
}

extend type Mutation {
  reserveStock(orderId: ID!, items: [ReservationItemInput!]!): ReserveStockPayload @auth
  releaseStock(reservationId: ID!): Boolean! @auth
  updateStock(inventoryId: ID, productId: ID, variantId: String, quantity: Int!): StockItem @auth(requires: [ADMIN, MERCHANT])
  createInventory(input: CreateInventoryInput!): InventoryItem @auth(requires: [ADMIN, MERCHANT])
  restockInventory(input: RestockInventoryInput!): RestockInventoryPayload @auth(requires: [ADMIN, MERCHANT])
  createWarehouse(input: CreateWarehouseInput!): Warehouse @auth(requires: [DELIVERY_PARTNER, ADMIN])
  updateWarehouse(input: UpdateWarehouseInput!): Warehouse @auth(requires: [DELIVERY_PARTNER, ADMIN])
  deleteWarehouse(id: ID!, deliveryPartnerId: ID): DeleteWarehouseResponse @auth(requires: [DELIVERY_PARTNER, ADMIN])
}
