type Rating {
  id: ID!
  productId: String!
  userId: String!
  orderId: String!
  orderItemId: String!
  rating: Int!
  review: String!
  isFlagged: Boolean!
  isHidden: Boolean!
  createdAt: String
  updatedAt: String
}

type ProductRatings {
  ratings: [Rating!]!
  averageRating: Float!
  total: Int!
}

type DeleteRatingResponse {
  success: Boolean!
  message: String!
}

input CreateRatingInput {
  productId: String!
  orderId: String!
  orderItemId: String!
  rating: Int!
  review: String
}

input UpdateRatingInput {
  id: ID!
  rating: Int!
  review: String
}

extend type Query {
  productRatings(productId: ID!, limit: Int, offset: Int): ProductRatings!
  getRating(id: ID!): Rating @auth
}

extend type Mutation {
  createRating(input: CreateRatingInput!): Rating @auth
  updateRating(input: UpdateRatingInput!): Rating @auth
  deleteRating(id: ID!): DeleteRatingResponse @auth
}
