enum FlagCategory {
  SPAM
  INAPPROPRIATE_CONTENT
  FAKE_REVIEW
  IRRELEVANT
  OTHER
}

type RatingImage {
  id: ID!
  ratingId: String!
  url: String!
  createdAt: String!
}

type Rating {
  id: ID!
  productId: String!
  userId: String!
  orderId: String!
  orderItemId: String!
  rating: Int!
  review: String!
  isFlagged: Boolean!
  isHidden: Boolean!
  images: [RatingImage!]
  createdAt: String
  updatedAt: String
}

type StarRating {
  fiveStar: Int!
  fourStar: Int!
  threeStar: Int!
  twoStar: Int!
  oneStar: Int!
}

type ProductRatings {
  ratings: [Rating!]!
  averageRating: Float!
  total: Int!
  stars: StarRating!
}

type DeleteRatingResponse {
  success: Boolean!
  message: String!
}

type FlagRatingResponse {
  success: Boolean!
  message: String!
}

input CreateRatingInput {
  productId: String!
  orderId: String!
  orderItemId: String!
  rating: Int!
  review: String
}

input UpdateRatingInput {
  id: ID!
  rating: Int!
  review: String
}

input FlagRatingInput {
  ratingId: ID!
  category: FlagCategory!
  reason: String
}

type RatingFlagInfo {
  id: ID!
  userId: String!
  category:FlagCategory!
  reason: String
  createdAt: String!
}

type FlaggedRatingItem {
  rating: Rating!
  flagCount: Int!
  flags: [RatingFlagInfo!]!
}

type FlaggedRatingsResponse {
  items: [FlaggedRatingItem!]!
  total: Int!
}

input ModerateRatingInput{
  ratingId: ID!
  isHidden: Boolean!
}

type ModerateRatingResponse {
  success: Boolean!
  message: String!
}

input UploadRatingImagesInput {
  ratingId: ID!
  images: [String!]
  imagesUpload: [Upload!]
}

type UploadRatingImagesResponse {
  images: [RatingImage!]!
}

type DeleteRatingImageResponse {
  success: Boolean!
  message: String!
}

extend type Query {
  productRatings(productId: ID!, limit: Int, offset: Int): ProductRatings!
  getRating(id: ID!): Rating @auth
  getFlaggedRating(limit: Int, offset: Int): FlaggedRatingsResponse! @auth(requires:[ADMIN])
}

extend type Mutation {
  createRating(input: CreateRatingInput!): Rating @auth
  updateRating(input: UpdateRatingInput!): Rating @auth
  deleteRating(id: ID!): DeleteRatingResponse @auth
  flagRating(input: FlagRatingInput!): FlagRatingResponse @auth
  moderateRating(input: ModerateRatingInput!): ModerateRatingResponse! @auth(requires:[ADMIN])
  uploadRatingImages(input: UploadRatingImagesInput!): UploadRatingImagesResponse! @auth
  deleteRatingImage(imageId: ID!): DeleteRatingImageResponse! @auth
}
