type AuthPayload {
  token: String!
  refreshToken: String
  tokenType: String
  expiresIn: Int
  user: User!
  merchantId: ID
  businessEmail: String
  firstName: String
  lastName: String
  role: String
  merchant: Merchant
}

input LoginInput {
  email: String!
  password: String!
  isMerchant: Boolean!
}

input RegisterInput {
  email: String!
  password: String!
  firstName: String
  lastName: String
  isMerchant: Boolean!
}

input RefreshTokenInput {
  refreshToken: String!
}

type LogoutPayload {
  success: Boolean!
  message: String
}

extend type Mutation {
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
  logout: LogoutPayload!
  verifyEmail(email: String!, otp: String!): Boolean!
  resendVerificationEmail(email: String!): Boolean!
}


