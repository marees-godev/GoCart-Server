type CartItem {
  id: ID!
  productId: String!
  quantity: Int!
  unitPrice: Float!
  totalPrice: Float!
}

type Cart {
  id: ID!
  userId: String!
  items: [CartItem!]!
  totalAmount: Float!
  totalItems: Int!
}

input AddToCartInput {
  productId: String!
  quantity: Int!
}

extend type Query {
  cart(userId: ID): Cart @auth
}

extend type Mutation {
  addToCart(input: AddToCartInput!): Cart @auth
  removeFromCart(userId: ID, productId: ID!): Cart @auth
  clearCart(userId: ID): Boolean! @auth
}
