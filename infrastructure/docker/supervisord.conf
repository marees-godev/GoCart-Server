[program:api-gateway]
directory=/app/gateway/api-gateway
command=/app/bin/api-gateway
environment=PORT="%(ENV_PORT)s",APP_NAME="api-gateway",USER_SERVICE_ADDR="localhost:5050",PRODUCT_SERVICE_ADDR="localhost:7070",CART_SERVICE_ADDR="localhost:8181",ORDER_SERVICE_ADDR="localhost:8500"
