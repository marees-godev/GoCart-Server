[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# ------------------------------------------------------------------------------
# 1. Auth Service (Port: 9451)
# ------------------------------------------------------------------------------
[program:auth-service]
directory=/app/services/auth-service
command=/app/bin/auth-service
environment=PORT="9451",APP_NAME="auth-service",DB_MIGRATIONS_PATH="/app/services/auth-service/migrations"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ------------------------------------------------------------------------------
# 2. User Service (Port: 5050)
# ------------------------------------------------------------------------------
[program:user-service]
directory=/app/services/user-service
command=/app/bin/user-service
environment=PORT="5050",APP_NAME="user-service",DB_MIGRATIONS_PATH="/app/services/user-service/migrations"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
