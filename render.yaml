# ==============================================================================
# GoCart Monorepo - Render Infrastructure Blueprint
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # 1. Auth Service
  # ----------------------------------------------------------------------------
  - type: web
    name: gocart-auth-service
    env: docker
    plan: free
    dockerfilePath: infrastructure/docker/Dockerfile.service
    dockerContext: .
    dockerBuildArgs:
      - key: SERVICE_NAME
        value: auth-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: APP_NAME
        value: auth-service
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

