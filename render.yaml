# ==============================================================================
# GoCart Monorepo - Single-Service Render Infrastructure Blueprint
# Runs all 14 microservices and API Gateway inside 1 Free Web Service via Supervisord
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: gocart-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: gocart-backend
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json
      - key: DB_AUTO_MIGRATE
        value: "false"
      # External PostgreSQL Connection URL (Neon / Supabase / etc.)
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SERVICE_DATABASE_URL
        sync: false
      - key: PAYMENT_SERVICE_DATABASE_URL
        sync: false
      - key: ORDER_SERVICE_DATABASE_URL
        sync: false
      - key: DELIVERY_SERVICE_DATABASE_URL
        sync: false
      - key: RETURN_SERVICE_DATABASE_URL
        sync: false
      - key: PRODUCT_SERVICE_DATABASE_URL
        sync: false
      - key: CATEGORY_SERVICE_DATABASE_URL
        sync: false
      - key: STORE_SERVICE_DATABASE_URL
        sync: false
      - key: MERCHANT_SERVICE_DATABASE_URL
        sync: false
      - key: CART_SERVICE_DATABASE_URL
        sync: false
      - key: USER_SERVICE_DATABASE_URL
        sync: false
      - key: INVENTORY_SERVICE_DATABASE_URL
        sync: false
      - key: RATINGS_SERVICE_DATABASE_URL
        sync: false
      - key: NOTIFICATIONS_SERVICE_DATABASE_URL
        sync: false
      # ==============================================================================
      # Independent Object Storage / S3 Configurations (Supabase S3)
      # ==============================================================================
      # 1. Store Service S3 Storage
      - key: STORE_S3_ENDPOINT
        value: https://cljkfzbiywvhzpmlbbuy.storage.supabase.co/storage/v1/s3
      - key: STORE_S3_REGION
        value: ap-south-1
      - key: STORE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORE_S3_BUCKET
        value: store-bucket
      - key: STORE_S3_PUBLIC_URL_PREFIX
        value: https://cljkfzbiywvhzpmlbbuy.supabase.co/storage/v1/object/public/store-bucket

      # 2. User Service S3 Storage
      - key: USER_S3_ENDPOINT
        value: https://skqvtkreczfavalydinl.storage.supabase.co/storage/v1/s3
      - key: USER_S3_REGION
        value: ap-south-1
      - key: USER_S3_ACCESS_KEY_ID
        sync: false
      - key: USER_S3_SECRET_ACCESS_KEY
        sync: false
      - key: USER_S3_BUCKET
        value: users-bucket
      - key: USER_S3_PUBLIC_URL_PREFIX
        value: https://skqvtkreczfavalydinl.supabase.co/storage/v1/object/public/users-bucket

      # 3. Product Service S3 Storage
      - key: PRODUCT_S3_ENDPOINT
        value: https://evgotinlxjijpglixpmn.storage.supabase.co/storage/v1/s3
      - key: PRODUCT_S3_REGION
        value: ap-south-1
      - key: PRODUCT_S3_ACCESS_KEY_ID
        sync: false
      - key: PRODUCT_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PRODUCT_S3_BUCKET
        value: products-bucket
      - key: PRODUCT_S3_PUBLIC_URL_PREFIX
        value: https://evgotinlxjijpglixpmn.supabase.co/storage/v1/object/public/products-bucket

      # ==============================================================================
      # Email & Notification Providers (Auth Service)
      # ==============================================================================
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: EMAIL_VERIFY_BASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: onboarding@resend.dev
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: nikotest122@gmail.com

      # ==============================================================================
      # Payment Gateway (Payment Service)
      # ==============================================================================
      - key: PAYMENT_GATEWAY_PROVIDER
        value: mock
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ==============================================================================
      # GSTIN Verification API (Store Service)
      # ==============================================================================
      - key: GSTIN_API_KEY
        sync: false
      - key: GSTIN_API_BASE_URL
        value: https://www.gstinapi.in/v1
      - key: GSTIN_VERIFICATION_ENABLED
        value: "true"

      # ==============================================================================
      # External Cache & Message Broker
      # ==============================================================================
      - key: REDIS_URL
        sync: false
      - key: KAFKA_BROKERS
        sync: false

      # ==============================================================================
      # API Gateway, Security & GraphQL
      # ==============================================================================
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: gocart-api-gateway
      - key: ADMIN_API_KEY
        sync: false
      - key: ADMIN_USER_ID
        value: super-admin-identity
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GRAPHQL_PLAYGROUND_ENABLED
        value: "true"
      - key: GRAPHQL_INTROSPECTION_ENABLED
        value: "true"
      - key: TRACING_ENABLED
        value: "false"
